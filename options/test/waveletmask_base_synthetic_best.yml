# ==============================================================================
# WaveletMask Synthetic Test Configuration
# ==============================================================================
# Test command:
# CUDA_VISIBLE_DEVICES=2 python test.py -opt options/test/waveletmask/waveletmask_base_synthetic_best.yml
# ==============================================================================
# ======================== Base Settings ========================
name: waveletmask_base_reds_synthetic_best
model_type: RTNGANModel
scale: 1
num_gpu: 1
manual_seed: 2021
dist: false
find_unused_parameters: true

# ======================== Dataset ========================
datasets:
  test:
    name: REDS_synthetic
    type: Film_dataset_1
    dataroot_gt: datasets/val/REDS/GT/val_sharp
    dataroot_lq: datasets/val/REDS/LQ/val_sharp_degraded
    num_frame: -1
    cache_data: true
    normalizing: true
    io_backend:
      type: disk

# ======================== Network ========================
network_g:
  type: WaveletMaskBaseNet
  num_feat: 16
  num_block: 6
  flow_type: raft

# ======================== Validation ========================
val:
  save_img: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true
    lpips:
      type: calculate_lpips
      crop_border: 0
      convert_to_grayscale: true
    dists:
      type: calculate_dists
      crop_border: 0
      convert_to_grayscale: true

# ======================== Logging ========================
logger:
  print_freq: 100

# ======================== Paths ========================
path:
  pretrain_network_g: projects/007-waveletmask/Exp/experiments/waveletmask/waveletmask_base/models/net_g_best.pth
  results_root: projects/007-waveletmask/Exp/results
