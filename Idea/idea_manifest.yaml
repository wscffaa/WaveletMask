- id: waveletmask_local_hf
  name: 局部高频掩码 (Local High-Frequency Mask)
  slot: spatial
  mount_point: Video_Backbone → forward/backward loop → residual_indicator
  strategy: 利用 Haar DWT 高频子带 (LH/HL/HH) 的几何均值差异检测划痕/灰尘等局部高频退化
  status: active
- id: waveletmask_flicker
  name: 全局闪烁掩码 (Global Flicker Mask)
  slot: spatial
  mount_point: Video_Backbone → forward/backward loop → residual_indicator
  strategy: 利用 LL 子带差异的 min 策略检测全局亮度闪烁，区分闪烁和场景切换
  status: active
archived_innovations:
- id: waveletmask_pixel_fusion
  name: 像素级 Alpha 融合 (Pixel-Wise Mask Fusion)
  slot: spatial
  mount_point: Video_Backbone → forward/backward loop → fused_indicator
  strategy: 4 层 CNN 学习像素级 alpha 权重自适应融合空间域掩码和频域掩码，bias=+5 初始化偏向空间掩码
  status: archived
  archived_reason: L40 权威数据确认在所有对照中有害 (2026-04-23)
